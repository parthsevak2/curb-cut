<template>
    <template if:true={error}>
        <p class="err" role="alert">{error}</p>
    </template>

    <template if:true={loaded}>
        <article class="brief">
            <p class="status" data-tone={waitTone}>{statusLine}</p>

            <h2 class="h">What they already told us</h2>
            <template if:true={data.theirWords}>
                <blockquote class="words">{data.theirWords}</blockquote>
            </template>
            <template if:false={data.theirWords}>
                <p class="none">No words are attached to this handoff. Don't ask them to
                   start again if you can avoid it.</p>
            </template>

            <h2 class="h">What this person asked you to know</h2>
            <p class="soft">If they saved something to travel ahead of them, they chose who's
               allowed to see it. Tell us who you're reading this as, and you'll see only
               what they chose for that audience.</p>
            <div class="asrow">
                <label class="lbl" for="readingAs">I am reading this as</label>
                <select id="readingAs" class="pick" onchange={roleChanged}>
                    <template for:each={roleOptions} for:item="o">
                        <option key={o.value} value={o.value} selected={o.selected}>{o.label}</option>
                    </template>
                </select>
            </div>
            <button class="take ask" onclick={reveal} aria-busy={asking}>
                Show me what they asked me to know
            </button>
            <p class="record">Reading this here is recorded. They can see that you saw it.</p>
            <p class="soft" role="status" aria-live="polite" aria-atomic="true">{revealStatus}</p>
            <template if:true={hasShown}>
                <ul class="said">
                    <template for:each={shown} for:item="s">
                        <li key={s.preferenceId} class="saidItem">
                            <blockquote class="words">{s.statement}</blockquote>
                            <p class="soft">In their words, saved {s.savedOn}.
                               Recorded as shown to {s.shownTo}.</p>
                        </li>
                    </template>
                </ul>
            </template>
            <template if:true={showError}>
                <p class="err" role="alert">{showError}</p>
            </template>

            <h2 class="h">How to reach them</h2>
            <p class="reach">{reachLine}</p>
            <p class="rule">Never by telephone. That is the door this record exists to keep open.</p>

            <ul class="flags">
                <template if:true={data.interpreter}>
                    <li class="flag">Needs a human interpreter. Signed video is never machine translated.</li>
                </template>
                <template if:true={data.neverCall}>
                    <li class="flag">This person has recorded that they cannot take a call at all.</li>
                </template>
                <template if:true={data.modality}>
                    <li class="soft">They came in by {data.modality}. Answer the same way.</li>
                </template>
            </ul>

            <template if:true={canTake}>
                <button class="take" onclick={take}>I am picking this up</button>
                <p class="soft">Puts your name on it, so the next shift can see it is
                   not waiting on nobody.</p>
            </template>
            <template if:true={data.pickedUp}>
                <p class="taken">Picked up by {data.handler}.</p>
            </template>

            <template if:true={needsInterpreter}>
                <button class="take book" onclick={book} disabled={working}>
                    I have booked an interpreter
                </button>
                <p class="soft">Nothing else on this record can move until a person is
                   booked, and the wait is the entire cost to them.</p>
            </template>
        </article>
    </template>
</template>
