<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 900" width="1500" height="900" role="img" aria-label="Curb Cut. A curb cut is cut for one person and used by everyone. Six barriers, each with the door Curb Cut opens: if you cannot type, send a photo or a video; if you are Deaf, sign it and a person interprets it, never a machine; if you use a screen reader, every channel is text first; if a phone call is not possible, nobody is ever routed to a telephone; if you have no work login, there is no account to make; if you do not want to say why, you are never asked. Six ways in: web, voice, text message, email, Slack and any AI assistant. Voice and text work on a basic phone with no internet at all. Thirty in a hundred have a disability. Three tell their employer.">
  <rect width="1500" height="900" fill="#F2F3F4"/>

  <!-- ═══ The ramp. A kerb with a cut in it, in profile. ═══ -->
  <g>
    <rect x="1128" y="140" width="132" height="52" fill="#C6CACE"/>
    <path d="M1260 140 L1362 192 L1260 192 Z" fill="#1C5245"/>
    <rect x="1128" y="192" width="252" height="9" fill="#9AA0A6"/>
    <line x1="1260" y1="140" x2="1362" y2="192" stroke="#12362D" stroke-width="2"/>
  </g>
  <text x="1128" y="232" font-family="Helvetica, Arial, sans-serif" font-size="12.5" letter-spacing="1.4" fill="#5A6068">THE CUT IS THE WHOLE IDEA</text>

  <!-- ═══ Headline ═══ -->
  <text x="70" y="88" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" letter-spacing="3.4" fill="#1C5245">CURB CUT</text>
  <text x="70" y="176" font-family="Georgia, 'Times New Roman', serif" font-size="62" font-weight="700" fill="#16181A">Cut for one person.</text>
  <text x="70" y="248" font-family="Georgia, 'Times New Roman', serif" font-size="62" font-weight="700" fill="#1C5245">Used by everyone.</text>
  <text x="70" y="300" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#42474C">So we cut one into the accommodation request.</text>

  <line x1="70" y1="342" x2="1430" y2="342" stroke="#16181A" stroke-width="2.5"/>

  <!-- ═══ Six barriers, six doors ═══ -->
  <text x="70" y="378" font-family="Helvetica, Arial, sans-serif" font-size="12.5" letter-spacing="1.6" fill="#8A2F24">WHAT USUALLY STOPS SOMEBODY</text>
  <text x="560" y="378" font-family="Helvetica, Arial, sans-serif" font-size="12.5" letter-spacing="1.6" fill="#1C5245">WHAT HAPPENS HERE INSTEAD</text>

  <g font-family="Helvetica, Arial, sans-serif">
    <text x="70" y="424" font-size="21" fill="#16181A">You cannot type</text>
    <text x="500" y="424" font-size="21" fill="#C6CACE">&#8594;</text>
    <text x="560" y="424" font-size="21" fill="#16181A">Send a photo, or a video</text>

    <text x="70" y="480" font-size="21" fill="#16181A">You are Deaf</text>
    <text x="500" y="480" font-size="21" fill="#C6CACE">&#8594;</text>
    <text x="560" y="480" font-size="21" fill="#16181A">Sign it. A person interprets it, never a machine</text>

    <text x="70" y="536" font-size="21" fill="#16181A">You use a screen reader</text>
    <text x="500" y="536" font-size="21" fill="#C6CACE">&#8594;</text>
    <text x="560" y="536" font-size="21" fill="#16181A">Every channel is text first</text>

    <text x="70" y="592" font-size="21" fill="#16181A">A phone call is not possible</text>
    <text x="500" y="592" font-size="21" fill="#C6CACE">&#8594;</text>
    <text x="560" y="592" font-size="21" fill="#16181A">Nobody is ever routed to a telephone</text>

    <text x="70" y="648" font-size="21" fill="#16181A">You have no work login</text>
    <text x="500" y="648" font-size="21" fill="#C6CACE">&#8594;</text>
    <text x="560" y="648" font-size="21" fill="#16181A">There is no account to make</text>

    <text x="70" y="704" font-size="21" fill="#16181A">You do not want to say why</text>
    <text x="500" y="704" font-size="21" fill="#C6CACE">&#8594;</text>
    <text x="560" y="704" font-size="21" fill="#16181A">You are never asked</text>
  </g>

  <line x1="70" y1="742" x2="1430" y2="742" stroke="#C6CACE"/>

  <!-- ═══ Six ways in ═══ -->
  <text x="70" y="784" font-family="Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#16181A">Web</text>
  <text x="172" y="784" font-family="Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#16181A">Voice</text>
  <text x="278" y="784" font-family="Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#16181A">Text message</text>
  <text x="470" y="784" font-family="Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#16181A">Email</text>
  <text x="576" y="784" font-family="Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#16181A">Slack</text>
  <text x="676" y="784" font-family="Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#16181A">Any AI assistant</text>
  <text x="920" y="784" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#1C5245">Two of them work on a basic phone, with no internet at all.</text>

  <line x1="70" y1="818" x2="1430" y2="818" stroke="#16181A" stroke-width="2.5"/>
  <text x="70" y="866" font-family="Georgia, 'Times New Roman', serif" font-size="30" font-weight="700" fill="#16181A">Thirty in a hundred have a disability. Three tell their employer.</text>
  <text x="1430" y="866" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#8A6115" text-anchor="end">The asking was the barrier.</text>
</svg>
