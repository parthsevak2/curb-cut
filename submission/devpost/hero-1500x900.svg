<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 900" width="1500" height="900" role="img" aria-label="Two ways to ask for the same chair. On the left, a three page HR accommodation form: employee number, the manager who will read it, a required box headed Nature of your disability with the cursor waiting, and a required attachment of physician documentation. On the right, Curb Cut asks what is hard right now, and the whole answer is: my back hurts by the afternoon.">
  <defs>
    <clipPath id="cut"><rect x="0" y="0" width="1500" height="900"/></clipPath>
  </defs>
  <rect width="1500" height="900" fill="#F2F3F4"/>

  <!-- ═══ LEFT. The form. Cold, numbered, three pages long. ═══ -->
  <rect x="70" y="72" width="620" height="602" fill="#FFFFFF" stroke="#D6D9DC" stroke-width="1"/>
  <rect x="70.5" y="72.5" width="619" height="45" fill="#EDEFF1"/>
  <text x="94" y="101" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="0.6" fill="#5A6068">ACCOMMODATION REQUEST</text>
  <text x="560" y="101" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#5A6068">Page 1 of 3</text>

  <text x="94" y="150" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#5A6068">Employee number</text>
  <rect x="94" y="160" width="240" height="34" fill="#F7F8F9" stroke="#D6D9DC"/>
  <text x="106" y="183" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#16181A">004871</text>

  <text x="380" y="150" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#5A6068">This request will be read by</text>
  <rect x="380" y="160" width="286" height="34" fill="#F7F8F9" stroke="#D6D9DC"/>
  <text x="392" y="183" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#16181A">your line manager</text>

  <text x="94" y="238" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#16181A">Nature of your disability</text>
  <text x="290" y="238" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#A32B22">*</text>
  <rect x="94" y="252" width="572" height="196" fill="#FFFFFF" stroke="#A32B22" stroke-width="1.5"/>
  <rect x="112" y="278" width="2" height="22" fill="#16181A"/>
  <text x="112" y="330" font-family="Helvetica, Arial, sans-serif" font-size="13.5" fill="#6E747C">Describe your condition and how it limits</text>
  <text x="112" y="354" font-family="Helvetica, Arial, sans-serif" font-size="13.5" fill="#6E747C">one or more major life activities.</text>
  <text x="112" y="424" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#6E747C">0 / 500 characters</text>

  <text x="94" y="486" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#16181A">Supporting documentation from a physician</text>
  <text x="470" y="486" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#A32B22">*</text>
  <rect x="94" y="500" width="572" height="52" fill="#F7F8F9" stroke="#D6D9DC" stroke-dasharray="5 4"/>
  <text x="112" y="532" font-family="Helvetica, Arial, sans-serif" font-size="13.5" fill="#6E747C">No file chosen</text>

  <text x="94" y="586" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#A32B22">All fields marked * are required.</text>

  <rect x="94" y="612" width="150" height="42" fill="#DDE0E3"/>
  <text x="132" y="639" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#8B9199">Continue</text>
  <text x="262" y="639" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#6E747C">Two more pages after this one.</text>

  <!-- ═══ RIGHT. Curb Cut. One question, one answer, done. ═══ -->
  <rect x="810" y="72" width="620" height="230" fill="#FFFFFF" stroke="#1C5245" stroke-width="1.5"/>
  <rect x="811.5" y="73.5" width="617" height="44" fill="#F1F6F4"/>
  <text x="834" y="101" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="0.6" fill="#1C5245">CURB CUT</text>
  <text x="1310" y="101" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1C5245">One page</text>

  <text x="834" y="158" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#16181A">What is hard right now?</text>
  <rect x="834" y="172" width="572" height="60" fill="#FFFFFF" stroke="#D6D9DC"/>
  <text x="850" y="210" font-family="Georgia, 'Times New Roman', serif" font-size="21" fill="#16181A">My back hurts by the afternoon.</text>
  <text x="834" y="268" font-family="Helvetica, Arial, sans-serif" font-size="13.5" fill="#1C5245">That is the whole form. No name, no login, no diagnosis,</text>
  <text x="834" y="288" font-family="Helvetica, Arial, sans-serif" font-size="13.5" fill="#1C5245">because there is nowhere in this system to put one.</text>

  <line x1="810" y1="348" x2="1430" y2="348" stroke="#C9CDD1"/>
  <text x="810" y="392" font-family="Georgia, 'Times New Roman', serif" font-size="27" fill="#16181A">Same chair. Same cost.</text>
  <text x="810" y="430" font-family="Georgia, 'Times New Roman', serif" font-size="27" fill="#16181A">Same person doing the same job.</text>
  <text x="810" y="486" font-family="Georgia, 'Times New Roman', serif" font-size="23" font-style="italic" fill="#42474C">Only one of them asks you to explain</text>
  <text x="810" y="520" font-family="Georgia, 'Times New Roman', serif" font-size="23" font-style="italic" fill="#42474C">your body to the person who decides</text>
  <text x="810" y="554" font-family="Georgia, 'Times New Roman', serif" font-size="23" font-style="italic" fill="#42474C">what you are worth on Monday.</text>

  <line x1="810" y1="606" x2="1430" y2="606" stroke="#C9CDD1"/>
  <text x="810" y="650" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#42474C">Sixty-one percent of accommodations cost the employer</text>
  <text x="810" y="676" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#42474C">nothing at all. The money was never what stopped anyone.</text>

  <!-- ═══ The line the whole thing rests on ═══ -->
  <rect x="70" y="756" width="1360" height="3" fill="#16181A"/>
  <text x="70" y="818" font-family="Georgia, 'Times New Roman', serif" font-size="35" font-weight="700" fill="#16181A">Thirty in a hundred have a disability. Three tell their employer.</text>
  <text x="70" y="860" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#42474C">The asking was the barrier. So we rebuilt the asking.</text>
  <text x="1430" y="860" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#8A6115" text-anchor="end">curbcut</text>
</svg>
